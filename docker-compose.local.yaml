# 로컬 개발용 docker-compose.
#
# MySQL / Redis / MinIO 까지 전부 로컬 컨테이너로 띄운다.
# app / celery-worker / celery-beat 는 EC2 구성과 동일하지만,
# DB_HOST / REDIS_HOST / MINIO_ENDPOINT 만 override.
#
# 사용: docker-compose -f docker-compose.local.yaml up -d
#
# 주의: ste 프로젝트와 컨테이너 이름이 충돌하면 한쪽 정리 필요.
services:
  mysql:
    image: mysql:8.4
    container_name: tms-mysql
    restart: always
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tms
      MYSQL_ROOT_PASSWORD: rootpassword
    command: --wait_timeout=28800 --interactive_timeout=28800
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2
    container_name: tms-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: tms-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    container_name: tms-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/tms-app;
      mc anonymous set download myminio/tms-app/public;
      echo 'MinIO init done';
      "

  app:
    build: .
    container_name: tms-api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      PYTHONPATH: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  celery-worker:
    build: .
    container_name: tms-celery-worker
    restart: always
    entrypoint: ["/usr/bin/tini", "--"]
    working_dir: /app
    command: >
      sh -c "
      export PYTHONPATH=/app &&
      celery -A app.workers.celery_app worker --loglevel=info -Q celery
      "
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: tms-celery-beat
    restart: always
    entrypoint: ["/usr/bin/tini", "--"]
    working_dir: /app
    command: >
      sh -c "
      export PYTHONPATH=/app &&
      celery -A app.workers.celery_app beat --loglevel=info
      "
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
