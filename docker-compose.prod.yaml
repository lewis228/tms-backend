# ============================================================================
# EC2 배포 전용 docker-compose.
#
# 사용:
#   docker-compose -f docker-compose.prod.yaml up -d --build
#
# 특징:
#   - .env 파일 없음. 환경변수는 EC2 환경(IAM Role + Parameter Store)에서 주입.
#   - RDS / ElastiCache / S3 사용 → 로컬 MySQL / Redis / MinIO 없음.
# ============================================================================

services:
  app:
    build: .
    container_name: tms-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: prod
      AWS_REGION: ap-northeast-2

  celery-worker:
    build: .
    container_name: tms-celery-worker
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--"]
    working_dir: /app
    command: >
      sh -c "
      export PYTHONPATH=/app &&
      celery -A app.workers.celery_app worker --loglevel=info -Q celery
      "
    environment:
      APP_ENV: prod
      AWS_REGION: ap-northeast-2

  celery-beat:
    build: .
    container_name: tms-celery-beat
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--"]
    working_dir: /app
    command: >
      sh -c "
      export PYTHONPATH=/app &&
      celery -A app.workers.celery_app beat --loglevel=info
      "
    environment:
      APP_ENV: prod
      AWS_REGION: ap-northeast-2
