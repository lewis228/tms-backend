# EC2용 docker-compose.
#
# MySQL / Redis / MinIO는 AWS 관리형 서비스(RDS / ElastiCache / S3)를 사용하므로 포함하지 않는다.
# 환경변수는 컨테이너 내부에서 src/common/const/config_bootstrap.py가
#   - .env 가 있으면 .env
#   - 없으면 AWS Parameter Store (/omniq/dev/shipmenttrackingengine/)
# 에서 로드한다. EC2에는 .env 를 두지 않고 IAM Role로 Parameter Store에 접근한다.
#
# 로컬에서 MySQL/Redis/MinIO까지 함께 띄우려면:
#   docker-compose -f docker-compose.local.yaml up -d
#
# 로컬 개발 환경 주의: .env 의 DB_HOST / REDIS_HOST / MINIO_ENDPOINT 는 `localhost` 로
# 세팅돼 있다. uvicorn 을 호스트에서 실행할 땐 맞지만, 컨테이너 내부에서 그대로 쓰면
# 자기 자신을 가리키게 된다. 따라서 celery-worker / celery-beat 는 ``environment`` 로
# ``host.docker.internal`` 오버라이드를 명시해 호스트의 포트 포워딩을 경유한다.
# (EC2 에선 .env 가 없고 Parameter Store 값을 쓰므로 이 오버라이드는 영향 없음.)
services:
  app:
    build: .
    container_name: app-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - MINIO_ENDPOINT=http://host.docker.internal:9000

  celery-worker:
    build: .
    container_name: app-celery-worker
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--"]
    working_dir: /app/src
    command: >
      sh -c "
      export PYTHONPATH=/app/src &&
      celery -A celery_app worker --loglevel=info -Q celery
      "
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - MINIO_ENDPOINT=http://host.docker.internal:9000

  celery-beat:
    build: .
    container_name: app-celery-beat
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--"]
    working_dir: /app/src
    command: >
      sh -c "
      export PYTHONPATH=/app/src &&
      celery -A celery_app beat --loglevel=info
      "
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - MINIO_ENDPOINT=http://host.docker.internal:9000
