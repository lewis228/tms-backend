[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "tms-backend"
version = "0.1.0"
description = "TMS Pro - Container Drayage Management System"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi[standard]==0.116.1",
  "starlette==0.47.3",
  "uvicorn==0.35.0",
  "websockets==16.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.1",
  "typing-extensions==4.12.2",
  "sqlalchemy[asyncio]==2.0.40",
  "alembic==1.13.1",
  "aiomysql==0.2.0",
  "PyMySQL==1.1.1",
  "greenlet==3.1.1",
  "anyio==4.8.0",
  "sniffio==1.3.1",
  "watchfiles==1.0.4",
  "httptools==0.6.4",
  "bcrypt==4.3.0",
  "PyJWT==2.10.1",
  "python-jose[cryptography]==3.3.0",
  "cryptography==42.0.5",
  "passlib[bcrypt]==1.7.4",
  "httpx==0.28.1",
  "boto3==1.42.11",
  "redis[hiredis]==5.0.4",
  "celery[redis]==5.4.0",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
  "orjson==3.10.15",
  "ujson==5.10.0",
  "structlog==24.4.0",
  "rich==13.9.4",
  "pytz==2025.2",
  "Pillow==12.2.0",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "testcontainers[mysql,redis]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ste 코드 자산 가져왔으므로 점진 cleanup. 일단 critical 룰만 강제.
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E9", "F"]   # syntax errors + undefined-name 만 강제
ignore = [
    "F401",  # unused imports — sed/cleanup 단계에서 정리
    "F403", "F405",  # star imports
    "E402",  # module level import 위치
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
